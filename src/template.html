<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>

    <div class="sidebar">
    <div class="sidebar-content">
      <h1>My Projects</h1>
      <button class="sidebar-btn new-project-btn">+ New Project</button>
      <div class="button-list">
        
      </div>

    </div>
  </div>

  <div class="content">
    <div class="header">
      <h1>All Todos</h1>
      <button class="delete-project-btn" hidden>trashSVG</button>
    </div>

    <div class="main">

      <div class="todo-list">

        <div class="todo-card">
          <button class="status"></button>
          <div class="todo-info">
            <h3 class="title">Finish Todo App</h3>
            <p class="description">Create the basic todo app</p>
          </div>
          <div class="priority high">High</div>
          <div class="due-date">Sep 7</div>
        </div>

      </div>

    </div>

      <form class="todo-input-bar">

        <button type="submit">+</button>

        <input type="text" id="title" name="title" placeholder="Add a task..." required>
        
        <select name="priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        
        <input type="date" id="due-date" name="due-date">

      </form>

  </div>

</body>
</html>
