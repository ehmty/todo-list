<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>

    <div class="sidebar">
    <div class="sidebar-content">
      <h1>My Projects</h1>
      <button class="sidebar-btn new-project-btn">+ New Project</button>
      <div class="button-list">
        <button class="sidebar-btn">Inbox <span>0</span></button>
      </div>

    </div>
  </div>

  <div class="content">
    <div class="header">
      <h1>All Todos</h1>
      <button class="header-btn">+ New Todo</button>
    </div>

    <div class="main">
      <div class="todo-card">
        <button class="status"></button>

        <div class="todo-info">
          <h3 class="title">Finish Todo App</h3>
          <p class="description">Create the basic todo app</p>
        </div>

        <div class="priority high">High</div>
        <div class="due-date">Sep 7</div>

      </div>
      <div class="todo-card">
        <button class="status"></button>

        <div class="todo-info">
          <h3 class="title">Finish Todo App</h3>
          <p class="description">Create the basic todo app</p>
        </div>

        <div class="priority low">Low</div>
        <div class="due-date">Okt 1</div>

      </div>
      <div class="todo-card">
        <button class="status"></button>

        <div class="todo-info">
          <h3 class="title">Finish Todo App</h3>
          <p class="description">Create the basic todo app</p>
        </div>

        <div class="priority medium">Medium</div>
        <div class="due-date">Sep 10</div>

      </div>

    </div>

  </div>
  
</body>
</html>
